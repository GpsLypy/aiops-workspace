(--blue);stroke-width:2.5;filter:drop-shadow(0 0 6px var(--shadow))}.chart .node.active text.title{fill:var(--blue)}.chart .node:focus-visible .box{stroke:var(--blue);stroke-width:3}.chart .node.final .box{stroke:var(--green)}.chart .node.write .box{stroke:var(--amber)}.chart .num{font:600 12px ui-monospace,SFMono-Regular,monospace;fill:var(--blue)}.chart .title{font-size:17px;font-weight:600}.chart .subtitle{font-size:12px;fill:var(--muted)}.chart .edge{fill:none;stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.chart .edge.read-edge{stroke:var(--green);marker-end:url(#arrow-read)}.chart .edge.write-edge{stroke:var(--amber);marker-end:url(#arrow-write)}.chart .edge.separate{stroke-dasharray:5 6}.chart .edge.traced{stroke-width:3;stroke:var(--blue);marker-end:url(#arrow-active)}.chart .label{font-size:12px;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:8px;stroke-linejoin:round}.chart .read-label{fill:var(--green)}.chart .write-label{fill:var(--amber)}.chart .lane{fill:var(--card);fill-opacity:.4;stroke:var(--line);stroke-dasharray:4 6}.chart .lane-title{font-size:13px;font-weight:550;fill:var(--amber)}.chart .terminal{font-size:12px;fill:var(--muted)}.legend{display:flex;gap:20px;flex-wrap:wrap;padding:0 18px 12px;font-size:12px;color:var(--muted)}.legend span:before{content:'';display:inline-block;width:20px;border-top:2px solid var(--line);vertical-align:middle;margin-right:7px}.legend .loop:before{border-color:var(--green)}.legend .later:before{border-color:var(--amber);border-top-style:dashed}.lesson{display:grid;grid-template-columns:1fr auto;align-items:start;gap:16px;margin-top:14px;padding:16px 18px;border-left:3px solid var(--blue);background:var(--panel);border-radius:0 8px 8px 0}.step-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:7px}.step-meta #progress{color:var(--blue);font-family:ui-monospace,SFMono-Regular,monospace}.lesson h2{font-size:17px;margin:0 0 6px;font-weight:600}.lesson p{font-size:13px;line-height:1.7;color:var(--muted);max-width:850px;margin:0}.controls{display:flex;align-items:center;gap:7px;padding-top:3px}.controls #play{background:var(--card);color:var(--blue)}.source{margin-top:10px;color:var(--muted);font:11px/1.6 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.footnote{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0 0}.footnote strong{font-weight:500;color:var(--amber)}.mobile-flow{display:none}.intro-mobile{display:none}.source summary{cursor:pointer;font-family:inherit;font-size:11px}.source span{display:block;margin-top:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}noscript p{padding:12px;border:1px solid var(--amber)}
@media(min-width:1600px){.page{padding-top:30px}.examples{margin-top:24px}.lesson{margin-top:18px;padding:20px}.chart .title{font-size:17px}}

@media(max-width:760px){.intro-desktop{display:none}.intro-mobile{display:inline}.page{padding:18px 12px;display:flex;flex-direction:column}.heading{order:0}.subhead{order:1}.examples{order:2}.sample{order:3}.lesson{order:4;margin:0 0 14px}.chart-panel{order:5}.footnote{order:6}.heading{align-items:flex-start;flex-wrap:wrap;gap:12px}h1{font-size:23px}.utility{margin-left:auto}.utility button{font-size:12px;padding:7px 10px}.subhead{font-size:13px}.examples{gap:6px;margin-top:16px}.examples-label{width:100%;margin-bottom:2px}.examples button{flex:1;padding:10px 4px;font-size:13px}.sample strong{display:block;margin-bottom:3px}.desktop-flow{display:none}.mobile-flow{display:block;padding:14px 13px 4px}.mobile-flow h2{font-size:13px;margin:0 0 14px;color:var(--muted);font-weight:500}.mobile-flow ol{margin:0;padding:0;list-style:none}.mobile-flow li{position:relative;padding:0 0 26px 26px;border-left:1px solid var(--line);margin-left:8px}.mobile-flow li:last-child{border-color:transparent;padding-bottom:8px}.mobile-flow li:not(:last-child):after{content:'↓';position:absolute;bottom:4px;left:23px;color:var(--muted);font-size:14px}.mobile-step{display:block;text-align:left;background:var(--card);width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;position:relative}.mobile-step:before{content:'';position:absolute;left:-32px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--line);border:3px solid var(--panel);box-sizing:content-box}.mobile-step[aria-current=step]{border-color:var(--blue)}.mobile-step[aria-current=step]:before{background:var(--blue)}.mobile-step small{display:block;font-size:11px;color:var(--muted);margin:0 0 5px}.mobile-step b{font-size:15px;font-weight:600;line-height:1.4}.mobile-step span{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-top:4px}.mobile-flow .separation{color:var(--amber);font-size:12px;line-height:1.7;margin:0 0 12px;padding-top:10px;border-top:1px dashed var(--amber)}.lesson{padding:14px;gap:12px}.controls{flex-wrap:wrap;gap:6px}.controls button{font-size:12px}.footnote{font-size:11px}.source{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<main class="page">
<div class="heading"><div><p class="eyebrow">运维百晓生 / 对话处理流程</p><h1>一句问题，怎样变成一个答复？</h1></div><div class="utility"><button id="theme" aria-label="切换颜色主题">切换浅色</button><button id="export">下载流程图 SVG</button></div></div>
<p class="subhead"><span class="intro-desktop">先沿上方 ① → ⑤ 看主线。需要查数据时走绿色回路，需要修改时走右侧审批分支。</span><span class="intro-mobile">选一个例子，按箭头从上往下看。重复出现的步骤，表示带着查询结果返回分析。</span></p>
<div class="examples" role="group" aria-label="选择流程示例"><span class="examples-label">选个例子，跟着看</span><button data-scenario="direct" aria-pressed="false">直接回答</button><button data-scenario="read" aria-pressed="true">查一次数据</button><button data-scenario="write" aria-pressed="false">发起修改</button></div>
<p class="sample"><strong id="sample-question"></strong><span id="sample-summary"></span></p>
<noscript><p>这是一张源码流程说明图；下方箭头可以直接阅读。启用 JavaScript 后可逐步演示、查看节点说明和导出。修改需要审批，待审批会结束本轮对话。</p></noscript>

<div class="desktop-flow"><div class="chart-heading"><b>上方主线 → 下方分支</b><span>点击任一步，查看由谁处理</span></div>

<title id="svg-title">一次对话的主线、只读工具回路与独立审批流程</title><desc id="svg-description">用户提问，系统受理，Agent准备资料，模型判断是否还需要工具。不需要则保存并显示答复；需要则后端检查工具请求。只读查询结果回到Agent再次请求模型。修改请求等待管理员审批并结束本轮；后续审批独立执行和核验，不自动续跑原对话。</desc>

<text class="label" x="983" y="87" text-anchor="middle">不需要</text>
<path class="edge" data-from="model" data-to="policy" d="M850 177V270"/><text class="label" x="863" y="225">需要工具</text>

<g class="node" id="node-question" tabindex="0" role="button" aria-label="第1步：你提出问题"><rect class="box" x="24" y="61" width="200" height="85" rx="9"/><text class="num" x="40" y="84">01 / 你</text><text class="title" x="40" y="111">你提出问题</text><text class="subtitle" x="40" y="132">浏览器发送消息</text></g>
<g class="node" id="node-accepted" tabindex="0" role="button" aria-label="第2步：系统受理"><rect class="box" x="272" y="61" width="200" height="85" rx="9"/><text class="num" x="288" y="84">02 / Node 后端</text><text class="title" x="288" y="111">系统受理</text><text class="subtitle" x="288" y="132">检查身份、权限与额度</text></g>
<g class="node" id="node-context" tabindex="0" role="button" aria-label="第3步：Agent准备资料"><rect class="box" x="520" y="61" width="200" height="85" rx="9"/><text class="num" x="536" y="84">03 / Agent + 后端</text><text class="title" x="536" y="111">Agent 准备资料</text><text class="subtitle" x="536" y="132">历史对话、手册、可用工具</text></g>
<g class="node" id="node-model" tabindex="0" role="button" aria-label="第4步：模型判断还需要工具吗"><path class="box" d="M850 29L936 103L850 177L764 103Z"/><text class="num" x="850" y="83" text-anchor="middle">04 / 模型</text><text class="title" x="850" y="108" text-anchor="middle" style="font-size:15px">还需要工具吗？</text><text class="subtitle" x="850" y="130" text-anchor="middle">根据资料判断</text></g>
<g class="node final" id="node-answer" tabindex="0" role="button" aria-label="第5步：保存并显示答复"><rect class="box" x="1030" y="61" width="224" height="85" rx="9"/><text class="num" x="1046" y="84">05 / 后端 → 你</text><text class="title" x="1046" y="111">保存并显示答复</text><text class="subtitle" x="1046" y="132">本轮完成 · 你看到结果</text></g>
<g class="node" id="node-policy" tabindex="0" role="button" aria-label="检查工具请求"><rect class="box" x="750" y="270" width="200" height="82" rx="9"/><text class="title" x="850" y="305" text-anchor="middle">检查工具请求</text><text class="subtitle" x="850" y="330" text-anchor="middle">后端核对权限、参数、风险</text></g>
<g class="node final" id="node-read" tabindex="0" role="button" aria-label="调用只读工具，结果返回Agent"><rect class="box" x="440" y="270" width="220" height="82" rx="9"/><text class="title" x="550" y="305" text-anchor="middle">调用只读工具</text><text class="subtitle" x="550" y="330" text-anchor="middle">读取数据，结果交回 Agent</text></g>
<g class="node write" id="node-pending" tabindex="0" role="button" aria-label="等待管理员审批，本轮到此结束"><rect class="box" x="1030" y="270" width="224" height="82" rx="9"/><text class="title" x="1142" y="305" text-anchor="middle">等待管理员审批</text><text class="subtitle" x="1142" y="330" text-anchor="middle">保存计划，本轮到此结束</text></g>
<g class="node write" id="node-approval" tabindex="0" role="button" aria-label="独立审批：管理员批准吗"><path class="box" d="M530 442L666 481L530 520L394 481Z"/><text class="title" x="530" y="477" text-anchor="middle" style="font-size:15px">管理员批准？</text><text class="subtitle" x="530" y="497" text-anchor="middle">执行中心</text></g>
<g class="node write" id="node-execute" tabindex="0" role="button" aria-label="审批通过，复查后执行修改"><rect class="box" x="770" y="449" width="200" height="64" rx="9"/><text class="title" x="870" y="476" text-anchor="middle" style="font-size:16px">复查后执行修改</text><text class="subtitle" x="870" y="498" text-anchor="middle">权限、版本、固定参数</text></g>
<g class="node final" id="node-verified" tabindex="0" role="button" aria-label="核验并记录结果"><rect class="box" x="1030" y="449" width="224" height="64" rx="9"/><text class="title" x="1142" y="476" text-anchor="middle" style="font-size:16px">核验并记录结果</text><text class="subtitle" x="1142" y="498" text-anchor="middle">成功、失败或结果待确认</text></g>
</svg><div class="legend"><span>主线与判断</span><span class="loop">只读结果返回</span><span class="later">本轮结束后的独立审批</span></div></div>
<div class="mobile-flow"><h2>当前示例的完整流程 · 按箭头往下看</h2><ol id="mobile-steps"></ol></div>
</section>
<section class="lesson" aria-label="当前步骤说明"><div><div class="step-meta"><span id="progress"></span><span id="owner"></span></div><h2 id="step-title"></h2><p id="step-detail" role="status" aria-live="polite"></p><details class="source"><summary>查看代码位置</summary><span id="step-source"></span></details></div><div class="controls"><button id="previous">上一步</button><button id="play" aria-pressed="false">自动演示</button><button id="next">下一步 →</button><button id="restart" aria-label="从头演示">↺ 重看</button></div></section>
<p class="footnote">这是普通聊天的流程演示，不读取真实会话，也不执行工具。<strong>修改待审批会结束本轮，批准后单独复查、执行和核验。</strong>图中省略默认关闭的委派与独立复核等可选分支。</p>
</main>
<script id="flow-data" type="application/json">__FLOW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('flow-data').textContent);
let scenario=data.scenarios.find(s=>s.id==='read'),position=0,timer=null;
const el=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function pause(){clearInterval(timer);timer=null;el('play').textContent='自动演示';el('play').setAttribute('aria-pressed','false');}
function mobileSteps(){
 const list=el('mobile-steps');list.replaceChildren();
 scenario.steps.forEach((id,index)=>{
  const node=data.nodes[id],li=document.createElement('li');
  if(id==='approval'){const note=document.createElement('p');note.className='separation';note.textContent='本轮聊天已结束。以下是稍后的独立审批示例；取消、过期或复查失败都不执行。';li.append(note);}
  const button=document.createElement('button');button.className='mobile-step';button.dataset.index=index;
  const owner=document.createElement('small');owner.textContent=`${index+1} / ${scenario.steps.length} · ${node.owner}`;
  const title=document.createElement('b');title.textContent=(index>0&&scenario.steps.indexOf(id)!==index?'返回  '+node.number+' · ':'')+node.title;
  const sub=document.createElement('span');sub.textContent=node.subtitle;
  button.append(owner,title,sub);button.onclick=()=>{pause();position=index;render();el('step-title').scrollIntoView({block:'nearest'});};li.append(button);list.append(li);
 });
}
function render(){
 const id=scenario.steps[position],node=data.nodes[id];
 el('sample-question').textContent=scenario.question;el('sample-summary').textContent=scenario.summary;
 el('progress').textContent=`${position+1} / ${scenario.steps.length} 步${id==='approval'||id==='execute'||id==='verified'?' · 后续独立审批':''}`;
 el('owner').textContent=node.owner;el('step-title').textContent=(node.number?node.number+' · ':'')+node.title;
 el('step-detail').textContent=node.detail;el('step-source').textContent=node.source;
 el('previous').disabled=position===0;el('next').disabled=position===scenario.steps.length-1;
 el('next').textContent=id==='pending'?'看后续审批 →':'下一步 →';
 document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scenario===scenario.id)));
 document.querySelectorAll('.node').forEach(g=>g.classList.toggle('active',g.id==='node-'+id));
 document.querySelectorAll('.edge').forEach(edge=>edge.classList.toggle('traced',edge.dataset.from===scenario.steps[position-1]&&edge.dataset.to===id));
 document.querySelectorAll('.mobile-step').forEach(b=>{if(Number(b.dataset.index)===position)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
 if(node.stop||position===scenario.steps.length-1)pause();
}
function select(id){pause();scenario=data.scenarios.find(s=>s.id===id);position=0;mobileSteps();render();}
document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>select(b.dataset.scenario));
el('previous').onclick=()=>{pause();position=Math.max(0,position-1);render();};
el('next').onclick=()=>{pause();position=Math.min(scenario.steps.length-1,position+1);render();};
el('restart').onclick=()=>{pause();position=0;render();};
el('play').onclick=()=>{
 if(timer){pause();return;}
 if(position===scenario.steps.length-1||data.nodes[scenario.steps[position]].stop)position=0;
 render();el('play').textContent='暂停演示';el('play').setAttribute('aria-pressed','true');
 timer=setInterval(()=>{position=Math.min(scenario.steps.length-1,position+1);render();},reduced.matches?3500:2400);
};
document.querySelectorAll('.node').forEach(g=>{
 const activate=()=>{pause();const id=g.id.slice(5);if(!scenario.steps.includes(id))select(id==='answer'?'direct':id==='read'?'read':'write');position=scenario.steps.indexOf(id);render();};
 g.addEventListener('click',activate);g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate();}});
});
el('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';el('theme').textContent=light?'切换深色':'切换浅色';};
el('export').onclick=()=>{
 const svg=el('flow-svg').cloneNode(true);svg.querySelectorAll('[tabindex],[role=button]').forEach(g=>{g.removeAttribute('tabindex');g.removeAttribute('role');});
 svg.querySelectorAll('.active').forEach(g=>g.classList.remove('active'));svg.querySelectorAll('.traced').forEach(g=>g.classList.remove('traced'));
 const style=document.createElementNS('http://www.w3.org/2000/svg','style');
 const vars=['bg','panel','card','ink','muted','line','blue','green','amber','shadow'].map(name=>`--${name}:${getComputedStyle(document.documentElement).getPropertyValue('--'+name)}`).join(';');
 style.textContent=`svg{${vars};background:var(--panel)}\n`+document.querySelector('style').textContent;svg.prepend(style);
 const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='运维百晓生-对话流程图.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
};
addEventListener('pagehide',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
mobileSteps();render();
