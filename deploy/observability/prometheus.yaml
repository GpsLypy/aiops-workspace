global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yaml
scrape_configs:
  - job_name: aiops
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
        refresh_interval: 15s
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
